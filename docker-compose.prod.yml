# ============================================================================
#  Doces Prigor OS — stack de PRODUÇÃO (VPS Hostinger, junto do ActPost)
#
#  Este compose NÃO sobe proxy nem banco próprios: reaproveita a
#  infraestrutura que já roda na VPS para o ActPost.
#
#    nginx-proxy + acme-companion   → já em 80/443, rede `actpost-proxy`
#    actpost-postgres               → já rodando, rede `actpost-internal`
#
#  O roteamento e o certificado saem automaticamente das variáveis
#  VIRTUAL_HOST / LETSENCRYPT_HOST abaixo — é assim que o nginx-proxy
#  descobre um container novo.
#
#  Antes do primeiro deploy é preciso criar o banco e o usuário do Prigor
#  dentro do Postgres do ActPost (uma vez só). Ver docs/DEPLOY.md, passo 3.
#
#  Subir:  ./deploy.sh
# ============================================================================

networks:
  proxy:
    name: actpost-proxy
    external: true
  internal:
    name: actpost-internal
    external: true

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: prigor/os:latest
    container_name: prigor-app
    restart: unless-stopped

    # Empresas adicionais (outros CNPJs) usam variáveis EMPRESA_<PREFIXO>_...,
    # com nomes que dependem do cadastro; por isso o .env inteiro entra no
    # container. O bloco `environment` abaixo continua tendo prioridade.
    env_file:
      - .env

    expose:
      - '3000'

    environment:
      NODE_ENV: production

      # O host do banco é o nome do container do Postgres do ActPost,
      # alcançável pela rede interna. Banco e usuário são próprios do Prigor.
      DATABASE_URL: postgresql://${PRIGOR_DB_USER}:${PRIGOR_DB_PASSWORD}@actpost-postgres:5432/${PRIGOR_DB_NAME}
      DIRECT_URL: postgresql://${PRIGOR_DB_USER}:${PRIGOR_DB_PASSWORD}@actpost-postgres:5432/${PRIGOR_DB_NAME}

      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      APP_URL: https://${APP_DOMAIN}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}

      # Só na primeira subida, para criar o administrador. Depois volte
      # para false e apague ADMIN_PASSWORD do .env.
      RUN_SEED: ${RUN_SEED:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}

      # Dados que aparecem no PDF do pedido
      COMPANY_NAME: ${COMPANY_NAME:-Doces Prigor}
      COMPANY_LEGAL_NAME: ${COMPANY_LEGAL_NAME:-}
      COMPANY_CNPJ: ${COMPANY_CNPJ:-}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-}
      COMPANY_CITY: ${COMPANY_CITY:-Rio de Janeiro}
      COMPANY_STATE: ${COMPANY_STATE:-RJ}
      COMPANY_ZIP: ${COMPANY_ZIP:-}
      COMPANY_PHONE: ${COMPANY_PHONE:-}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-}

      # Faturamento (ver docs/INTEGRACAO-BOLETO-NF.md). Configure com:
      #   ./scripts/configurar-nf.sh
      FISCAL_PROVIDER: ${FISCAL_PROVIDER:-}
      FISCAL_API_TOKEN: ${FISCAL_API_TOKEN:-}
      FISCAL_ENV: ${FISCAL_ENV:-homologacao}
      FISCAL_WEBHOOK_SECRET: ${FISCAL_WEBHOOK_SECRET:-}
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      SICOOB_ENV: ${SICOOB_ENV:-sandbox}
      SICOOB_CLIENT_ID: ${SICOOB_CLIENT_ID:-}
      SICOOB_NUMERO_CLIENTE: ${SICOOB_NUMERO_CLIENTE:-}
      SICOOB_CONTA_CORRENTE: ${SICOOB_CONTA_CORRENTE:-}
      SICOOB_MODALIDADE: ${SICOOB_MODALIDADE:-1}
      # Certificado A1 em base64 + senha (gerado por: npm run sicoob:comando-vps)
      SICOOB_CERT_BASE64: ${SICOOB_CERT_BASE64:-}
      SICOOB_CERT_PASSWORD: ${SICOOB_CERT_PASSWORD:-}

      # Node em container: sem teto explícito o V8 dimensiona a heap pela
      # RAM do host, não pelo limite do container.
      NODE_OPTIONS: --max-old-space-size=512

      # Roteamento e certificado automáticos (nginx-proxy + acme-companion)
      # APP_HOSTS existe para quando o sistema mora em um subdomínio
      # (app.docesprigor.com.br): aí não há "www." para pedir certificado.
      VIRTUAL_HOST: ${APP_HOSTS:-${APP_DOMAIN},www.${APP_DOMAIN}}
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: ${APP_HOSTS:-${APP_DOMAIN},www.${APP_DOMAIN}}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}

    # A VPS é KVM 1 (4GB) e já roda o Spring Boot do ActPost com 768MB de
    # heap. Este teto impede que um vazamento aqui derrube o vizinho.
    mem_limit: 768m
    mem_reservation: 256m

    networks:
      - proxy
      - internal

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # --------------------------------------------------------------------------
  #  Site oficial (docesprigor.com.br) — código em ./site
  #
  #  Só sobe quando o perfil "site" está ativo; o deploy.sh ativa sozinho
  #  quando SITE_DOMAIN existe no .env (quem grava é scripts/publicar-site.sh).
  #  Banco SQLite e imagens enviadas pelo painel ficam no volume prigor-site-data.
  #  Os pedidos do site chegam ao ERP pela rede interna do Docker, sem sair
  #  para a internet.
  # --------------------------------------------------------------------------
  site:
    profiles: ['site']
    build:
      context: ./site
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN:-docesprigor.com.br}
        NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
    image: prigor/site:latest
    container_name: prigor-site
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/prigor.db
      UPLOAD_DIR: /data/uploads
      NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN:-docesprigor.com.br}
      NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
      ADMIN_EMAIL: ${SITE_ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${SITE_ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SITE_SESSION_SECRET:-}
      ERP_ORDERS_URL: http://prigor-app:3000/api/public/site-orders
      SITE_ORDERS_SECRET: ${SITE_ORDERS_SECRET:-}
      NODE_OPTIONS: --max-old-space-size=384
      VIRTUAL_HOST: ${SITE_DOMAIN:-docesprigor.com.br},www.${SITE_DOMAIN:-docesprigor.com.br}
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: ${SITE_DOMAIN:-docesprigor.com.br},www.${SITE_DOMAIN:-docesprigor.com.br}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - prigor-site-data:/data
    mem_limit: 512m
    mem_reservation: 128m
    networks:
      - proxy
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

volumes:
  prigor-site-data:
    name: prigor-site-data
