# ============================================================================
#  Doces Prigor OS — stack de PRODUÇÃO (VPS Hostinger, junto do ActPost)
#
#  Este compose NÃO sobe proxy nem banco próprios: reaproveita a
#  infraestrutura que já roda na VPS para o ActPost.
#
#    nginx-proxy + acme-companion   → já em 80/443, rede `actpost-proxy`
#    actpost-postgres               → já rodando, rede `actpost-internal`
#
#  O roteamento e o certificado saem automaticamente das variáveis
#  VIRTUAL_HOST / LETSENCRYPT_HOST abaixo — é assim que o nginx-proxy
#  descobre um container novo.
#
#  Antes do primeiro deploy é preciso criar o banco e o usuário do Prigor
#  dentro do Postgres do ActPost (uma vez só). Ver docs/DEPLOY.md, passo 3.
#
#  Subir:  ./deploy.sh
# ============================================================================

networks:
  proxy:
    name: actpost-proxy
    external: true
  internal:
    name: actpost-internal
    external: true

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: prigor/os:latest
    container_name: prigor-app
    restart: unless-stopped

    expose:
      - '3000'

    environment:
      NODE_ENV: production

      # O host do banco é o nome do container do Postgres do ActPost,
      # alcançável pela rede interna. Banco e usuário são próprios do Prigor.
      DATABASE_URL: postgresql://${PRIGOR_DB_USER}:${PRIGOR_DB_PASSWORD}@actpost-postgres:5432/${PRIGOR_DB_NAME}
      DIRECT_URL: postgresql://${PRIGOR_DB_USER}:${PRIGOR_DB_PASSWORD}@actpost-postgres:5432/${PRIGOR_DB_NAME}

      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      APP_URL: https://${APP_DOMAIN}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:?defina GOOGLE_MAPS_API_KEY no .env}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}

      # Só na primeira subida, para criar o administrador. Depois volte
      # para false e apague ADMIN_PASSWORD do .env.
      RUN_SEED: ${RUN_SEED:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}

      # Dados que aparecem no PDF do pedido
      COMPANY_NAME: ${COMPANY_NAME:-Doces Prigor}
      COMPANY_LEGAL_NAME: ${COMPANY_LEGAL_NAME:-}
      COMPANY_CNPJ: ${COMPANY_CNPJ:-}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-}
      COMPANY_CITY: ${COMPANY_CITY:-Rio de Janeiro}
      COMPANY_STATE: ${COMPANY_STATE:-RJ}
      COMPANY_ZIP: ${COMPANY_ZIP:-}
      COMPANY_PHONE: ${COMPANY_PHONE:-}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-}

      # Node em container: sem teto explícito o V8 dimensiona a heap pela
      # RAM do host, não pelo limite do container.
      NODE_OPTIONS: --max-old-space-size=512

      # Roteamento e certificado automáticos (nginx-proxy + acme-companion)
      VIRTUAL_HOST: ${APP_DOMAIN},www.${APP_DOMAIN}
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: ${APP_DOMAIN},www.${APP_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}

    # A VPS é KVM 1 (4GB) e já roda o Spring Boot do ActPost com 768MB de
    # heap. Este teto impede que um vazamento aqui derrube o vizinho.
    mem_limit: 768m
    mem_reservation: 256m

    networks:
      - proxy
      - internal

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
