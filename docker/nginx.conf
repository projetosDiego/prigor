# Proxy reverso com HTTPS.
# Troque `SEU_DOMINIO` pelo domínio real antes de subir.

upstream prigor_app {
    server app:3000;
    keepalive 32;
}

# Limita tentativas de login também na borda, além do limite da aplicação.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=geral:10m rate=30r/s;

server {
    listen 80;
    server_name SEU_DOMINIO;

    # Desafio do Let's Encrypt precisa continuar em HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name SEU_DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Cabeçalhos de segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

    client_max_body_size 12M;

    # A aplicação precisa do IP real para o limite de tentativas funcionar.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://prigor_app;
    }

    location /api/health {
        access_log off;
        proxy_pass http://prigor_app;
    }

    # Assets do Next são versionados por hash: cache longo e imutável.
    location /_next/static/ {
        proxy_pass http://prigor_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        limit_req zone=geral burst=60 nodelay;
        proxy_pass http://prigor_app;
        proxy_read_timeout 60s;
    }
}
