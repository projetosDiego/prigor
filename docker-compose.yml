# Ambiente de DESENVOLVIMENTO: sobe só o banco.
# A aplicação roda fora do container, com `npm run dev`.
services:
  db:
    image: postgres:16-alpine
    container_name: prigor-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prigor
    ports:
      # Porta no HOST. Se a 5432 ja estiver ocupada na sua maquina (outro
      # Postgres instalado, outro projeto), ponha DB_PORT=5433 no .env e ajuste
      # DATABASE_URL e DIRECT_URL para a mesma porta.
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata-dev:
